[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/gana-python/Cargo.toml"
python-source = "src"
module-name = "gana._native"
features = ["extension-module"]

[project]
name = "gana"
version = "1.0.14"
authors = [
  { name="Rahul Kakodkar", email="cacodcar@gmail.com" },
]
maintainers = [
  { name="Rahul Kakodkar", email="cacodcar@gmail.com" },
]
description = "A barebones mathematical programming package"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["modeling", "optimization", "programming", "aml"]

classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = ["ppopt", "gurobipy", "IPython", "numpy", "pandas", "matplotlib"]
[project.optional-dependencies]
all = ["pyomo", "sympy"]
#  complete test tooling.
test = ["coverage", "pytest", "hypothesis", "flake8", "gurobipy", "pytest-cov"]
quality = ["radon", "ruff==0.16.9", "mypy", "tox", "build", "setuptools", "wheel", "packaging", "pandas-stubs==2.3.3.260113", "scipy-stubs==1.16.2.4"]
docs = [
    "sphinx",            
    "sphinx-book-theme",  
    "nbsphinx",          
    "sphinx_mdinclude",     
    "myst-nb", 
    "sphinxcontrib-bibtex",
    "sphinx-copybutton",
    "sphinx-togglebutton",
    "sphinx-thebe",
    "sphinx-design",
    "sphinx-examples",          
    "sphinx-tabs",
    "sphinxext-opengraph",
]

[project.urls]
Homepage = "https://github.com/cacodcar/gana"
Issues = "https://github.com/cacodcar/gana/issues"


#  independent measured coverage floors.
[tool.research-quality]
package = "gana"
statement-floor = 53
branch-floor = 35
local-dependencies = []

#  check annotated and unannotated bodies.
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
explicit_package_bases = true
namespace_packages = true
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/tools"]

# PPOPT 1.6.12 ships annotations without a py.typed marker. Analyze its actual
# source so callers are checked against those signatures; do not ignore imports.
[[tool.mypy.overrides]]
module = ["ppopt", "ppopt.*"]
follow_untyped_imports = true
