#  identical gates on both supported Pythons.
[tox]
envlist = py312, py313

[testenv]
extras = test, quality, docs
commands =
    python {toxinidir}/tools/quality.py all

[flake8]
# Match Ruff formatting; retain the strict line-length check.
max-line-length = 79
# Preserve the public mathematical names I and O, matching Ruff's policy.
per-file-ignores =
    src/gana/sets/index.py:E742
    src/gana/sets/objective.py:E742
