name: Release 1.1.0 artifacts

on:
  push:
    branches: [release/1.1.0-artifacts]
    paths: [.github/workflows/release-artifacts.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_REF: 105ef80d02512ee191018963899a284a3748f07e
  RELEASE_VERSION: 1.1.0

defaults:
  run:
    shell: bash

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the source distribution from the merged release
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          maturin-version: '1.9.6'
          rust-toolchain: '1.88.0'
      - name: Check source distribution metadata
        run: |
          python -m pip install 'twine==6.2.0'
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            platform: macos-x64
            target: x86_64-apple-darwin
          - os: macos-14
            platform: macos-arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-sdist
          path: source
      - name: Extract the exact source archive to be published
        run: python -c "import tarfile; tarfile.open('source/gana-${{ env.RELEASE_VERSION }}.tar.gz').extractall('source', filter='data')"
      - name: Build the platform wheel from the source archive
        uses: PyO3/maturin-action@v1
        with:
          working-directory: source/gana-${{ env.RELEASE_VERSION }}
          target: ${{ matrix.target }}
          args: --release --locked --out wheels
          manylinux: '2014'
          maturin-version: '1.9.6'
          rust-toolchain: '1.88.0'
      - name: Check wheel metadata
        run: |
          python -m pip install 'twine==6.2.0'
          python -m twine check --strict source/gana-${{ env.RELEASE_VERSION }}/wheels/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheel-${{ matrix.platform }}
          path: source/gana-${{ env.RELEASE_VERSION }}/wheels/*.whl
          if-no-files-found: error

  installed-wheel-tests:
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
        platform: [linux-x64, windows-x64, macos-x64, macos-arm64]
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: windows-x64
            os: windows-2022
          - platform: macos-x64
            os: macos-15-intel
          - platform: macos-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: release-wheel-${{ matrix.platform }}
          path: wheelhouse
      - name: Install the wheel and dependencies without a source build
        run: |
          python -m pip install --only-binary=:all: wheelhouse/*.whl pytest
          python -m pip check
      - name: Test the installed package outside the checkout
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          root = Path.cwd()
          with tempfile.TemporaryDirectory(prefix='gana-wheel-') as folder:
              for name in ('native_storage_test.py', 'native_coordinates_test.py',
                           'native_dense_export_test.py', 'native_adapters_test.py'):
                  shutil.copy2(root / 'tests' / name, folder)
              env = os.environ.copy()
              env.pop('PYTHONPATH', None)
              env.pop('GANA_BACKEND', None)
              env['MPLBACKEND'] = 'Agg'
              env['MPLCONFIGDIR'] = str(Path(folder) / 'mpl')
              check = (
                  'import gana, gana._native; from importlib.metadata import version; '
                  'from pathlib import Path; '
                  'assert version("gana") == gana.__version__ == "1.1.0"; '
                  'assert "site-packages" in Path(gana.__file__).parts; '
                  'print(gana.__file__); print(gana._native.__file__)'
              )
              subprocess.run([sys.executable, '-I', '-c', check], cwd=folder, env=env, check=True)
              subprocess.run([sys.executable, '-I', '-m', 'pytest', '-q', folder],
                             cwd=folder, env=env, check=True)
          PY
