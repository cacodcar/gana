name: Build Gana release artifacts

on:
  push:
    branches: ['release/*-artifacts']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the package version
        id: version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the source distribution from the release commit
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          maturin-version: '1.9.6'
          rust-toolchain: '1.88.0'
      - name: Check source distribution metadata
        run: |
          python -m pip install 'twine==6.2.0'
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: source
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            platform: macos-x64
            target: x86_64-apple-darwin
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-sdist
          path: source
      - name: Extract the exact source archive to be published
        run: python -c "import tarfile; tarfile.open('source/gana-${{ env.RELEASE_VERSION }}.tar.gz').extractall('source', filter='data')"
      - name: Build the platform wheel from the source archive
        uses: PyO3/maturin-action@v1
        with:
          working-directory: source/gana-${{ env.RELEASE_VERSION }}
          target: ${{ matrix.target }}
          args: --release --locked --out wheels
          manylinux: '2014'
          maturin-version: '1.9.6'
          rust-toolchain: '1.88.0'
      - name: Check wheel metadata
        run: |
          python -m pip install 'twine==6.2.0'
          python -m twine check --strict source/gana-${{ env.RELEASE_VERSION }}/wheels/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheel-${{ matrix.platform }}
          path: source/gana-${{ env.RELEASE_VERSION }}/wheels/*.whl
          if-no-files-found: error

  installed-wheel-tests:
    needs: [source, wheels]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
        platform: [linux-x64, windows-x64, macos-x64, macos-arm64]
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: windows-x64
            os: windows-2022
          - platform: macos-x64
            os: macos-15-intel
          - platform: macos-arm64
            os: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: release-wheel-${{ matrix.platform }}
          path: wheelhouse
      - name: Install the wheel and dependencies without a source build
        run: |
          python -m pip install --only-binary=:all: wheelhouse/*.whl pytest
          python -m pip check
      - name: Test the installed package outside the checkout
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          root = Path.cwd()
          with tempfile.TemporaryDirectory(prefix='gana-wheel-') as folder:
              for name in ('native_storage_test.py', 'native_coordinates_test.py',
                           'native_dense_export_test.py', 'native_adapters_test.py',
                           'priced_objective_test.py', 'solution_file_test.py',
                           'highs_test.py', 'default_solver_test.py'):
                  shutil.copy2(root / 'tests' / name, folder)
              env = os.environ.copy()
              env.pop('PYTHONPATH', None)
              env.pop('GANA_BACKEND', None)
              env['MPLBACKEND'] = 'Agg'
              env['MPLCONFIGDIR'] = str(Path(folder) / 'mpl')
              check = (
                  'import gana, gana._native; from importlib.metadata import version; '
                  'from pathlib import Path; import os; '
                  'assert version("gana") == gana.__version__ == os.environ["RELEASE_VERSION"]; '
                  'assert "site-packages" in Path(gana.__file__).parts; '
                  'print(gana.__file__); print(gana._native.__file__)'
              )
              subprocess.run([sys.executable, '-I', '-c', check], cwd=folder, env=env, check=True)
              subprocess.run([sys.executable, '-I', '-m', 'pytest', '-q', folder],
                             cwd=folder, env=env, check=True)
          PY

  bundle:
    needs: [source, installed-wheel-tests]
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release/dist
      - name: Collect the tested distributions and changelog entry
        run: |
          sha256sum release/dist/* > release/SHA256SUMS
          cd release/dist
          test "$(find . -mindepth 1 | wc -l)" -eq 5
          test -f "gana-$RELEASE_VERSION.tar.gz"
          test -f "gana-$RELEASE_VERSION-cp312-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          test -f "gana-$RELEASE_VERSION-cp312-abi3-win_amd64.whl"
          test -f "gana-$RELEASE_VERSION-cp312-abi3-macosx_10_12_x86_64.whl"
          test -f "gana-$RELEASE_VERSION-cp312-abi3-macosx_11_0_arm64.whl"
          cd ../..
          awk -v heading="## [$RELEASE_VERSION] - " '
            /^## / { if (printing) exit; printing = index($0, heading) == 1 }
            printing { print }
          ' CHANGELOG.md > release/notes.md
          test -s release/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: gana-release-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
