#  preserve failures and upload all evidence.
name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Authenticate Codecov uploads using this GitHub job's identity.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pin Rust for the required extension build
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set 1.88.0
      - run: python docs/_shared/check.py
      - name: Install test, quality, and documentation tools
        run: python -m pip install -c docs/_shared/constraints.txt -e '.[test,quality,docs]'
      - name: Run all blocking gates
        run: python tools/quality.py all --output quality/reports/ci
      - name: Verify documentation controls in Chromium
        if: matrix.python-version == '3.13'
        run: |
          npm install --prefix "$RUNNER_TEMP/docs-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/docs-browser/node_modules/.bin/playwright" install --with-deps chromium
          python -m http.server 8765 --bind 127.0.0.1 --directory quality/reports/ci/html > "$RUNNER_TEMP/docs-http.log" 2>&1 &
          docs_server_pid=$!
          trap 'kill "$docs_server_pid"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/index.html > /dev/null
          kill -0 "$docs_server_pid"
          NODE_PATH="$RUNNER_TEMP/docs-browser/node_modules" node docs/_shared/browser-check.cjs
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('quality/reports/ci/coverage.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: quality/reports/ci/coverage.xml
          # Exclude preserved baseline reports from the current measurement.
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
      - name: Preserve gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.python-version }}
          path: quality/reports/
