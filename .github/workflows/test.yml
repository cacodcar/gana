#  retain required test jobs and add coverage gates.
name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12, 3.13]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[test,quality]'

      - name: Run tests
        run: python tools/quality.py tests --output quality/reports/tests

      #  retain profiles even for failed tests.
      - name: Preserve test and profiling evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tests-and-profile-${{ matrix.python-version }}
          path: quality/reports/tests/
