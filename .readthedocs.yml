# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.13"
    # Bootstrap rustup with an RTD-supported version, then use the CI compiler.
    rust: "1.86"
  jobs:
    pre_install:
      # Read the Docs manages rustup through asdf; do not replace that executable.
      - rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - rustup override set 1.88.0
    post_install:
      # Sphinx imports src/gana, which must contain the compiled extension.
      - python -m pip install -e '.[docs]'

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py
